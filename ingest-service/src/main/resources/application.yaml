server:
  port: 8082

spring:
  application:
    name: ingest-service
  security:
    user:
      name: user
      password: password
  kafka:
    bootstrap-servers: localhost:9092 # in Docker: kafka:29092 (via environment variable)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all # wait until the event is safely stored
      properties:
        enable.idempotence: true # no duplicates from producer retries (default in new clients)
    properties:
      spring.json.add.type.headers: false
      enable.idempotence: true
      max.block.ms: 5000           # don't hang 60 s when Kafka is down
      request.timeout.ms: 3000
      delivery.timeout.ms: 5000    # must be >= request.timeout.ms + linger.ms

kafka-topic:
  reading: 'gridwatch.readings'

