services:
  db:
    ports:
      - "5435:5432"
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gridwatch
      POSTGRES_USER: gridwatch
      POSTGRES_PASSWORD: gridwatch-local
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gridwatch -d gridwatch" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: