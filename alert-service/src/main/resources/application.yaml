server:
  port: 8081

spring:
  application:
    name: alert-service
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://localhost:5435/gridwatch
    username: gridwatch
    password: gridwatch-local
  security:
    user:
      name: gridwatch
      password: gridwatch-local-api
  kafka:
    bootstrap-servers: localhost:9092 # in Docker: kafka:29092 (via environment variable)
    consumer:
       group-id: alert.gridwatch
       auto-offset-reset: earliest
       key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
       value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
       properties:
          spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
          spring.json.value.default.type: com.hapi.gridwatch.alert.dto.ReadingRestRequest
          spring.json.trusted.packages: com.hapi.gridwatch.alert.dto
          spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000    # must be >= request.timeout.ms + linger.ms
  rabbitmq:
    host: localhost
    port: 5672
    username: gridwatch
    password: gridwatch-local
    publisher-confirm-type: correlated # broker confirms each message
    publisher-returns: true # tell me if no queue matched
    template:
      mandatory: true

logging:
  file:
    name: logs/alert-service.log

kafka-topic:
  reading: 'gridwatch.readings'
  reading-dlt: 'gridwatch.readings-dlt'

rabbit:
  exchange: 'gridwatch.work-orders'
  routing-key: 'work-order.created'