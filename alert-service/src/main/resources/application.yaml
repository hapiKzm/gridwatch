server:
  port: 8081

spring:
  application:
    name: alert-service
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://localhost:5435/gridwatch
    username: gridwatch
    password: gridwatch-local
  security:
    user:
      name: gridwatch
      password: gridwatch-local-api
  kafka:
    bootstrap-servers: localhost:9092 # in Docker: kafka:29092 (via environment variable)
    consumer:
       group-id: alert.gridwatch
       auto-offset-reset: earliest
       key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
       value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
       properties:
          spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
          spring.json.value.default.type: com.hapi.gridwatch.alert.dto.ReadingRestRequest
          spring.json.trusted.packages: com.hapi.gridwatch.alert.dto
          spring.json.add.type.headers: false

