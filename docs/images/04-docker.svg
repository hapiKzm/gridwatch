<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <style>
    .t{font-size:30px;font-weight:700;fill:#111}
    .h{font-size:21px;font-weight:700;fill:#111}
    .s{font-size:16px;fill:#333}
    .l{font-size:16px;fill:#111;font-weight:600}
    .ln{stroke:#333;stroke-width:2.2;fill:none;marker-end:url(#a)}
    .nn{stroke:#7c3aed;stroke-width:2.2;fill:none;marker-end:url(#n)}
    .ns{font-size:16px;fill:#7c3aed;font-weight:600}
  </style>
  <rect width="900" height="860" fill="#fff"/>
  <text x="450" y="50" text-anchor="middle" class="t">Docker Compose: containers and addresses</text>

  <rect x="20" y="80" width="860" height="560" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="40" y="110" class="l">Docker network: containers call each other by SERVICE NAME</text>

  <rect x="60" y="135" width="220" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="170" text-anchor="middle" class="h">ingest</text><text x="170" y="196" text-anchor="middle" class="s">our Dockerfile</text>
  <rect x="340" y="135" width="220" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="170" text-anchor="middle" class="h">alert</text><text x="450" y="196" text-anchor="middle" class="s">our Dockerfile</text>
  <rect x="620" y="135" width="220" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="170" text-anchor="middle" class="h">notifier</text><text x="730" y="196" text-anchor="middle" class="s">our Dockerfile</text>

  <rect x="60" y="470" width="180" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="150" y="505" text-anchor="middle" class="h">kafka</text><text x="150" y="530" text-anchor="middle" class="s">apache/kafka:4.1.0</text>
  <rect x="270" y="470" width="180" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="505" text-anchor="middle" class="h">db</text><text x="360" y="530" text-anchor="middle" class="s">postgres:17-alpine</text>
  <rect x="480" y="470" width="180" height="90" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="570" y="505" text-anchor="middle" class="h">rabbitmq</text><text x="570" y="530" text-anchor="middle" class="s">rabbitmq:4-mgmt</text>
  <rect x="690" y="470" width="170" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="775" y="505" text-anchor="middle" class="h">mailpit</text><text x="775" y="530" text-anchor="middle" class="s">axllent/mailpit</text>

  <line x1="150" y1="215" x2="150" y2="470" class="ln"/>
  <rect x="60" y="300" width="130" height="26" fill="#fff"/><text x="65" y="319" class="s">kafka:29092</text>

  <line x1="410" y1="215" x2="170" y2="470" class="ln"/>
  <rect x="230" y="345" width="120" height="26" fill="#fff"/><text x="235" y="364" class="s">kafka:29092</text>
  <line x1="440" y1="215" x2="370" y2="470" class="ln"/>
  <rect x="345" y="395" width="105" height="26" fill="#fff"/><text x="350" y="414" class="s">db:5432</text>
  <line x1="480" y1="215" x2="560" y2="470" class="ln"/>
  <rect x="470" y="290" width="135" height="26" fill="#fff"/><text x="475" y="309" class="s">rabbitmq:5672</text>

  <line x1="680" y1="215" x2="590" y2="470" class="nn"/>
  <rect x="610" y="380" width="135" height="26" fill="#fff"/><text x="615" y="399" class="ns">rabbitmq:5672</text>
  <line x1="660" y1="215" x2="400" y2="470" class="nn"/>
  <rect x="565" y="236" width="150" height="26" fill="#fff"/><text x="570" y="255" class="ns">db:5432/notifier</text>
  <line x1="770" y1="215" x2="775" y2="470" class="nn"/>
  <rect x="740" y="300" width="125" height="26" fill="#fff"/><text x="745" y="319" class="ns">mailpit:1025</text>

  <text x="40" y="610" class="s">Purple arrows = notifier. Apps start only when db, kafka, rabbitmq are healthy.</text>

  <text x="40" y="680" class="h">From your laptop / IntelliJ: localhost + published port</text>
  <text x="40" y="715" class="s">ingest localhost:8082 · alert :8081 · notifier :8083 · db localhost:5435 · kafka localhost:9092</text>
  <text x="40" y="742" class="s">rabbitmq :5672, dashboard :15672 · mailpit SMTP :1025, inbox :8025</text>

  <text x="40" y="795" class="h">Same code, different address → environment variables in compose</text>
  <text x="40" y="828" class="s">SPRING_KAFKA_BOOTSTRAP_SERVERS · SPRING_DATASOURCE_URL · SPRING_RABBITMQ_HOST · SPRING_MAIL_HOST</text>
</svg>
