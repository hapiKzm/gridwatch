<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <style>
    .t{font-size:30px;font-weight:700;fill:#111}
    .h{font-size:22px;font-weight:700;fill:#111}
    .s{font-size:17px;fill:#333}
    .l{font-size:17px;fill:#111;font-weight:600}
    .ln{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#a)}
    .er{stroke:#b91c1c;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#r)}
  </style>
  <rect width="900" height="1180" fill="#fff"/>
  <text x="450" y="50" text-anchor="middle" class="t">RabbitMQ: alert → notifier → email</text>

  <rect x="200" y="85" width="500" height="125" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="118" text-anchor="middle" class="h">alert-service = PUBLISHER</text>
  <text x="450" y="145" text-anchor="middle" class="s">1. save work order, publishEvent(WorkOrderCreatedEvent)</text>
  <text x="450" y="170" text-anchor="middle" class="s">2. commit → @TransactionalEventListener(AFTER_COMMIT)</text>
  <text x="450" y="195" text-anchor="middle" class="s">3. rabbitTemplate.convertAndSend(exchange, key, event)</text>

  <line x1="450" y1="210" x2="450" y2="270" class="ln"/>
  <text x="470" y="235" class="l">routing key work-order.created</text>
  <text x="470" y="257" class="s">body = JSON (JacksonJsonMessageConverter)</text>

  <polygon points="450,270 680,315 450,360 220,315" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="450" y="312" text-anchor="middle" class="h">EXCHANGE (topic)</text>
  <text x="450" y="337" text-anchor="middle" class="s">gridwatch.work-orders</text>

  <line x1="450" y1="360" x2="450" y2="420" class="ln"/>
  <text x="470" y="385" class="l">BINDING work-order.*</text>
  <text x="470" y="407" class="s">key matches → copy into this queue</text>

  <rect x="230" y="420" width="440" height="80" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="450" y="455" text-anchor="middle" class="h">QUEUE notifier.work-orders</text>
  <text x="450" y="482" text-anchor="middle" class="s">waits here if notifier is down · deleted after ack</text>

  <line x1="450" y1="500" x2="450" y2="560" class="ln"/>
  <text x="470" y="535" class="l">@RabbitListener</text>

  <rect x="150" y="560" width="600" height="175" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="593" text-anchor="middle" class="h">notifier-service = CONSUMER</text>
  <text x="180" y="625" class="s">validate: field missing → AmqpRejectAndDontRequeueException</text>
  <text x="180" y="652" class="s">notifyOnce (one transaction):</text>
  <text x="200" y="678" class="s">• id in sent_notification? → skip (no duplicate email)</text>
  <text x="200" y="704" class="s">• else save id, send email; email fails → rollback</text>

  <line x1="300" y1="735" x2="300" y2="800" class="ln"/>
  <text x="140" y="775" class="l">success → ack</text>
  <rect x="110" y="800" width="190" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="205" y="835" text-anchor="middle" class="h">PostgreSQL</text>
  <text x="205" y="860" text-anchor="middle" class="s">db notifier</text>
  <rect x="320" y="800" width="190" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="415" y="835" text-anchor="middle" class="h">Mailpit</text>
  <text x="415" y="860" text-anchor="middle" class="s">SMTP 1025</text>
  <line x1="300" y1="760" x2="400" y2="760" stroke="#333" stroke-width="2.5"/>
  <line x1="400" y1="760" x2="400" y2="800" class="ln"/>

  <path d="M750 650 L820 650 L820 920" class="er"/>
  <text x="560" y="785" class="l" fill="#b91c1c">exception:</text>
  <text x="560" y="808" class="s">temporary → retry 3x (1 s, 2 s)</text>
  <text x="560" y="831" class="s">invalid → no retry</text>
  <text x="560" y="854" class="s">then reject, no requeue</text>
  <rect x="580" y="920" width="300" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="730" y="955" text-anchor="middle" class="h">DEAD-LETTER QUEUE</text>
  <text x="730" y="980" text-anchor="middle" class="s">notifier.work-orders.dlq</text>

  <text x="40" y="1060" class="l">Publisher knows only exchange + routing key. Consumer owns queue, binding and DLQ.</text>
  <text x="40" y="1090" class="l">Message is a job: done once, then deleted (Kafka keeps messages, RabbitMQ doesn't).</text>
  <text x="40" y="1120" class="s">No queue bound for the key → message dropped (mandatory=true makes it come back + logged).</text>
</svg>
